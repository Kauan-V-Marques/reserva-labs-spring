spring.application.name=reserva-labs

spring.datasource.url=jdbc:postgresql://localhost:5432/reservas
spring.datasource.username=reservas
spring.datasource.password=reservas

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Scripts comuns + scripts especificos do banco em uso ({vendor} = postgresql, h2...)
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info

app.time-zone=America/Sao_Paulo
