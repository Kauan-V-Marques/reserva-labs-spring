# Testes locais usam H2 em modo PostgreSQL. No CI, as variaveis SPRING_DATASOURCE_*
# apontam para um PostgreSQL real e sobrescrevem estes valores.
spring.datasource.url=jdbc:h2:mem:reservas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
